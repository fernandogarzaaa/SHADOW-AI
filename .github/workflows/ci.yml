name: CI
on: [push, pull_request]

jobs:
  rc-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall apps/shadow-node packages
      - name: Test
        run: pytest -q
      - name: Demo smoke
        run: make demo
      - name: Package install check
        run: |
          python -m venv /tmp/pkgcheck
          /tmp/pkgcheck/bin/pip install --quiet .
          cd /tmp && /tmp/pkgcheck/bin/python - <<'PY'
          import os, shadow_node, agent_core, memory_engine, axiom_adapter, ghost_adapter
          d = os.path.dirname(shadow_node.__file__)
          for f in ("policy.yaml", "web/index.html"):
              assert os.path.isfile(os.path.join(d, f)), f"missing package data: {f}"
          print("package install OK")
          PY
      - name: Secret scan
        run: |
          if grep -rEn "sk-[A-Za-z0-9]{20,}|(api[_-]?key|secret|password)[[:space:]]*=[[:space:]]*['\"][^'\"]{8,}" \
            --include='*.py' --include='*.swift' --include='*.md' --include='*.yml' \
            apps packages scripts; then
            echo "Potential secret detected"; exit 1
          fi
          echo "No secrets detected"

  mobile-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Type-check
        working-directory: apps/mobile
        run: npx tsc --noEmit
