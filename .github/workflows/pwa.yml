name: PWA
on:
  push:
    paths: ["apps/pwa/**", ".github/workflows/pwa.yml"]
  pull_request:
    paths: ["apps/pwa/**", ".github/workflows/pwa.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build PWA
        run: npx expo export -p web
      - name: Run new-user simulation
        env:
          SHADOW_AUTH_REQUIRED: "true"
          SHADOW_NODE_URL: http://127.0.0.1:8799
          PYTHONPATH: ../../apps/shadow-node:../../packages/agent-core:../../packages/memory-engine:../../packages/axiom-adapter:../../packages/ghost-adapter
        run: |
          python -m pip install -r ../../requirements.txt
          python -m uvicorn shadow_node.main:app --host 127.0.0.1 --port 8799 --log-level warning &
          NODE_PID=$!
          trap "kill $NODE_PID" EXIT
          for i in $(seq 1 30); do
            if curl -fsS "$SHADOW_NODE_URL/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "$SHADOW_NODE_URL/health"
          npx --yes tsx sim/new-user-sim.ts
      - name: Verify PWA artifacts
        run: |
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js
          echo "PWA build OK"
