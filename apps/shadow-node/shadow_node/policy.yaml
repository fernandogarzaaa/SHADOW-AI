# SHADOW node policy: the single policy authority (Sentinel-lite).
#
# Rules are data, not code. The node loads this file at startup
# (override with SHADOW_POLICY_FILE). Every agent action flows through
# agent_core.PolicyEngine.decide(), which evaluates in a fixed order and
# returns exactly one of: allow, deny, require_approval.
#
# Operator-owned. The agent cannot modify this file through any node API;
# changes require operator access to the node host and a node restart.
# Every decision is recorded in the tamper-evident audit chain with the
# rule_id that fired, so any denial is explainable.

version: 1

# Tools that are always denied, no matter the autonomy mode or approvals.
# Description patterns catch renamed variants of the same abuse.
blocked_tools:
  - keylogger
  - covert_monitor
  - bypass_ios_sandbox
  - silent_microphone
  - silent_camera
  - leak_secret

blocked_description_patterns:
  - keylog
  - covert
  - bypass ios
  - silently record
  - reveal secret

# Tools that change or destroy state. Destructive actions additionally
# require double confirmation at execution time (not just approval).
destructive_tools:
  - delete_file
  - overwrite_file
  - shell_rm

# Tools that always require explicit user approval before execution,
# even in permissive autonomy modes.
sensitive_tools:
  - send_email
  - send_message
  - write_file
  - device_control
  - cloud_model
  - ghost_handoff
  - calendar.create
  - email.draft

# Irreversible action classes (Sentinel gate, Hark item 12). Maps tool name
# to one of: destructive, external_send, publish, financial.
# Every irreversible action ALWAYS requires an explicit recorded approval:
# no tier, autonomy mode, or persona can waive the gate. The destructive,
# external_send, and financial classes additionally require double
# confirmation. The approval card shows the consequence text for the class
# so the confirmation names what will happen.
# Extend this when adding publish/financial tools; unknown class names are
# a hard startup error.
irreversible_tools:
  delete_file: destructive
  overwrite_file: destructive
  shell_rm: destructive
  send_email: external_send
  send_message: external_send

# Risk classes that require explicit user approval.
approval_required_risks:
  - medium
  - high
  - blocked

# Per-tool approval tiers. Optional; empty means the engine behaves exactly
# as before. Tiers can only relax the *approval* requirement: they never
# override emergency pause, blocked tools, or destructive double
# confirmation, and `auto_approve` never waives high/blocked risk,
# sensitive tools, or destructive actions.
#
# always_ask:   the tool always needs explicit approval
# auto_approve: routine (low/medium risk) uses run without approval
# always_allow: the tool never needs approval
#
# Examples (commented out = current default behavior):
# tool_tiers:
#   web_search: auto_approve
#   calendar.read: auto_approve
#   memory.recall: always_allow
#   send_email: always_ask
tool_tiers: {}

# Tools whose parameters leave this node. Their parameters are scanned
# before running: anything that looks like a credential (API key, token,
# private key, password) is always refused; payment card and Social
# Security numbers need an approval that names them. No tier or user rule
# can waive either. Users also can't "Always allow" these tools.
outbound_tools:
  - send_email
  - send_message
  - email.draft
  - calendar.create
  - http.get
  - web.search
