[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-ai"
version = "0.1.0"
description = "SHADOW-AI node: local-first agent runtime (shadow-node app plus agent-core, memory-engine, axiom-adapter and ghost-adapter packages)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fernando Garza", email = "fernandogarzaaa@gmail.com" }]
# Runtime dependencies, mirrored from requirements.txt.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "cryptography>=42",
    "httpx>=0.27",
    "pyyaml>=6",  # policy.yaml loader
    "mcp>=2,<3",  # mcp_server.py targets the 2.x Server(on_list_tools=...) API
]

[project.optional-dependencies]
# Browser agent (sandboxed Chrome via Playwright). Uses the installed Google
# Chrome when present; otherwise run `playwright install chromium`.
browser = [
    "playwright>=1.48",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
]

# The repo is a multi-root layout (apps/ and packages/*), which setuptools'
# automatic discovery refuses ("multiple top-level packages"). Map each of the
# five import packages to its directory explicitly.
[tool.setuptools]
packages = ["shadow_node", "agent_core", "memory_engine", "axiom_adapter", "ghost_adapter"]

[tool.setuptools.package-dir]
shadow_node = "apps/shadow-node/shadow_node"
agent_core = "packages/agent-core/agent_core"
memory_engine = "packages/memory-engine/memory_engine"
axiom_adapter = "packages/axiom-adapter/axiom_adapter"
ghost_adapter = "packages/ghost-adapter/ghost_adapter"

[tool.setuptools.package-data]
# Default policy and the bundled web dashboard are read from the package dir at runtime.
shadow_node = ["policy.yaml", "policy.yaml.example", "web/*", "web/vendor/*/*"]

[tool.pytest.ini_options]
pythonpath = ["apps/shadow-node", "packages/agent-core", "packages/memory-engine", "packages/axiom-adapter", "packages/ghost-adapter"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
extend-exclude = ["apps/mobile", "apps/ios-shadow"]

[tool.ruff.lint]
# Bug classes only for now (syntax errors, undefined names, redefinitions,
# unused variables, invalid comparisons). Style rules can be layered on
# once the existing code is reformatted.
select = ["E9", "F63", "F7", "F82", "F811", "F841"]
